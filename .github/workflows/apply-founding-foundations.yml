name: Apply founding foundations

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-founding-foundations.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply staged founding foundations'
    runs-on: ubuntu-latest
    steps:
      - name: Attach the validated repository tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TREE: 7024ace53f6ec89956e38aa4acc2ee054b3776e7
          FINAL_MESSAGE: |-
            docs(foundations): establish the science of renewal

            Make the Founding Book the guiding source for the Charter, Essentia, and later Society design. Add Part B as the scientific and economic basis, revise Part A, and align public documentation without changing the manifesto.
        run: |
          set -euo pipefail

          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          payload="$({
            jq -n \
              --arg message "$FINAL_MESSAGE" \
              --arg tree "$TARGET_TREE" \
              --arg parent "$GITHUB_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}'
          })"

          response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/commits" \
            --data "$payload")"

          commit_sha="$(jq -er '.sha' <<<"$response")"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/git/refs/heads/main" \
            --data "$(jq -n --arg sha "$commit_sha" '{sha: $sha, force: false}')"
